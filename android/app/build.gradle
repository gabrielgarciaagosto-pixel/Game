apply plugin: 'com.android.application'

android {
    namespace = "com.deathismybusiness.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.deathismybusiness.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 99
        versionName "0.9.81-demo"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions "audience"
    productFlavors {
        player {
            dimension "audience"
            isDefault.set(true)
        }
        master {
            dimension "audience"
            applicationIdSuffix ".master"
        }
    }
    def demoSigningFile = rootProject.file("demo-signing.properties")
    if (!demoSigningFile.exists()) {
        throw new GradleException("Missing android/demo-signing.properties. Demo APKs use the house demo keystore, not the platform debug certificate. That file is gitignored.")
    }
    def demoSigning = new Properties()
    demoSigningFile.withInputStream { demoSigning.load(it) }
    signingConfigs {
        demo {
            storeFile file(demoSigning.getProperty("storeFile"))
            storePassword demoSigning.getProperty("storePassword")
            keyAlias demoSigning.getProperty("keyAlias")
            keyPassword demoSigning.getProperty("keyPassword")
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.demo
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.demo
        }
    }
    applicationVariants.configureEach { variant ->
        def expected = variant.flavorName
        if (expected != "player" && expected != "master") {
            return
        }
        variant.preBuildProvider.configure { task ->
            task.doFirst {
                def roleFile = file("src/main/assets/public/ossuarian-role.json")
                if (!roleFile.exists()) {
                    throw new GradleException("Missing src/main/assets/public/ossuarian-role.json. From the repo root run npm run build:" + expected + " and then npx cap sync android.")
                }
                def parsed = new groovy.json.JsonSlurper().parseText(roleFile.getText("UTF-8"))
                if (parsed.role != expected) {
                    throw new GradleException("The " + expected + " flavor found web role \"" + parsed.role + "\". Run npm run build:" + expected + " and npx cap sync android before assembling.")
                }
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
